<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Douze par douze</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#17202a; --muted:#68707a; --accent:#2f6fed; --done:#dff4e7; --doneText:#176b35; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:7px 8px 6px; text-align:center; background:var(--card); position:sticky; top:0; z-index:2; box-shadow:0 1px 8px #00000012; }
  h1 { margin:0 0 1px; font-size:20px; }
  .subtitle { color:var(--muted); font-size:10px; }
  main { max-width:760px; margin:0 auto; padding:6px 4px 10px; }
  .top { display:flex; gap:6px; align-items:center; justify-content:space-between; margin-bottom:5px; }
  .progress { font-weight:700; font-size:12px; }
  button { border:0; border-radius:12px; padding:6px 9px; font-weight:700; cursor:pointer; }
  #reset { background:#e9edf3; color:var(--text); }
  .board { display:grid; grid-template-columns:repeat(13, minmax(0,1fr)); gap:3px; width:100%; padding:2px; }
  .cell { min-width:0; aspect-ratio:1; border-radius:6px; background:var(--card); border:1px solid #dce1e7; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; user-select:none; cursor:pointer; }
  .cell.head { background:#edf1f6; cursor:default; color:var(--muted); }
  .cell.done { background:var(--card); color:#111; border-color:#dce1e7; }
.cell.column-complete { background:#e8f6ea; color:#111; border-color:#d3ead7; }
  .rowlabel { position:sticky; left:0; background:#edf1f6; z-index:1; }
  .legend { margin-top:5px; color:var(--muted); font-size:9px; line-height:1.2; text-align:center; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); opacity:0; background:#17202a; color:white; padding:10px 15px; border-radius:999px; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media(max-width:600px){ .cell{font-size:11px;} }
</style>
</head>
<body>
<header>
  <h1>🎲 Douze par douze</h1>
  <div class="subtitle">Première version — tableau de progression</div>
</header>
<main>
  <div class="top">
    <div class="progress" id="progress">0 / 144 cases</div>
    <button id="reset">Nouvelle partie</button>
  </div>
  <div class="board" id="board"></div>
  <div class="legend">Touchez une case pour la cocher. La progression est sauvegardée automatiquement sur cet appareil.</div>
</main>
<div class="toast" id="toast">Progression sauvegardée</div>

<script>
const KEY = "douze-par-douze-v1";
let state = JSON.parse(localStorage.getItem(KEY) || "null") || Array.from({length:12},()=>Array(12).fill(false));
const board = document.getElementById("board");
const progress = document.getElementById("progress");
const toast = document.getElementById("toast");

function render(){
  board.innerHTML = "";
  const corner = document.createElement("div");
  corner.className = "cell head";
  corner.textContent = "N°";
  board.appendChild(corner);

  const columnComplete = Array.from({length:12}, (_, c) =>
    state.every(row => row[c])
  );

  for(let c=1;c<=12;c++){
    const h=document.createElement("div");
    h.className="cell head" + (columnComplete[c-1] ? " column-complete" : "");
    h.textContent=c;
    board.appendChild(h);
  }

  for(let r=0;r<12;r++){
    const label=document.createElement("div");
    label.className="cell head rowlabel";
    label.textContent=r+1;
    board.appendChild(label);

    for(let c=0;c<12;c++){
      const cell=document.createElement("div");
      cell.className="cell"
        +(state[r][c] ? " done" : "")
        +(columnComplete[c] ? " column-complete" : "");
      cell.textContent=state[r][c]?"✓":"";
      cell.setAttribute("aria-label",`Catégorie ${r+1}, case ${c+1}`);

      cell.onclick=()=>{
        if(!state[r][c]){
          // Progression verticale : une case ne peut être cochée
          // que si toutes les cases précédentes de la même colonne le sont.
          const previousAllDone = state.slice(0,r).every(row => row[c]);
          if(!previousAllDone){
            showToast("Cochez d’abord les cases précédentes de cette colonne");
            return;
          }
          state[r][c]=true;
        } else {
          // Une seule case peut être retirée : uniquement la dernière
          // case cochée de cette colonne.
          const lastDone = state.reduce((last, row, index) => row[c] ? index : last, -1);
          if(r !== lastDone){
            showToast("Vous devez retirer le dernier crochet de cette colonne");
            return;
          }
          state[r][c]=false;
        }
        localStorage.setItem(KEY,JSON.stringify(state));
        render();
        showToast();
      };
      board.appendChild(cell);
    }
  }

  const total=state.flat().filter(Boolean).length;
  progress.textContent=`${total} / 144`;
}
function showToast(){
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),700);
}
document.getElementById("reset").onclick=()=>{
  if(confirm("Commencer une nouvelle partie et effacer toute la progression ?")){
    state=Array.from({length:12},()=>Array(12).fill(false));
    localStorage.setItem(KEY,JSON.stringify(state));
    render();
  }
};
render();
</script>
</body>
</html>
