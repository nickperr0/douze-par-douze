<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Douze par douze</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#17202a; --muted:#68707a; --accent:#2f6fed; --done:#dff4e7; --doneText:#176b35; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 16px 14px; text-align:center; background:var(--card); position:sticky; top:0; z-index:2; box-shadow:0 1px 8px #00000012; }
  h1 { margin:0 0 4px; font-size:28px; }
  .subtitle { color:var(--muted); font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:16px 12px 28px; }
  .top { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .progress { font-weight:700; }
  button { border:0; border-radius:12px; padding:11px 14px; font-weight:700; cursor:pointer; }
  #reset { background:#e9edf3; color:var(--text); }
  .board { display:grid; grid-template-columns:repeat(13, minmax(42px,1fr)); gap:7px; overflow-x:auto; padding:4px 2px 12px; -webkit-overflow-scrolling:touch; }
  .cell { min-width:42px; aspect-ratio:1; border-radius:11px; background:var(--card); border:1px solid #dce1e7; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; user-select:none; cursor:pointer; }
  .cell.head { background:#edf1f6; cursor:default; color:var(--muted); }
  .cell.done { background:var(--done); color:var(--doneText); border-color:#bfe6ca; }
  .rowlabel { position:sticky; left:0; background:#edf1f6; z-index:1; }
  .legend { margin-top:12px; color:var(--muted); font-size:13px; line-height:1.45; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); opacity:0; background:#17202a; color:white; padding:10px 15px; border-radius:999px; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media(max-width:600px){ main{padding:12px 8px 28px;} h1{font-size:25px;} .board{grid-template-columns:repeat(13,44px);gap:7px;} .cell{min-width:44px;} }
</style>
</head>
<body>
<header>
  <h1>🎲 Douze par douze</h1>
  <div class="subtitle">Première version — tableau de progression</div>
</header>
<main>
  <div class="top">
    <div class="progress" id="progress">0 / 144 cases</div>
    <button id="reset">Nouvelle partie</button>
  </div>
  <div class="board" id="board"></div>
  <div class="legend">Touchez une case pour la cocher. La progression est sauvegardée automatiquement sur cet appareil.</div>
</main>
<div class="toast" id="toast">Progression sauvegardée</div>

<script>
const KEY = "douze-par-douze-v1";
let state = JSON.parse(localStorage.getItem(KEY) || "null") || Array.from({length:12},()=>Array(12).fill(false));
const board = document.getElementById("board");
const progress = document.getElementById("progress");
const toast = document.getElementById("toast");

function render(){
  board.innerHTML = "";
  const corner = document.createElement("div");
  corner.className = "cell head";
  corner.textContent = "N°";
  board.appendChild(corner);

  for(let c=1;c<=12;c++){
    const h=document.createElement("div");
    h.className="cell head"; h.textContent=c; board.appendChild(h);
  }

  for(let r=0;r<12;r++){
    const label=document.createElement("div");
    label.className="cell head rowlabel"; label.textContent=r+1; board.appendChild(label);
    for(let c=0;c<12;c++){
      const cell=document.createElement("div");
      cell.className="cell"+(state[r][c]?" done":"");
      cell.textContent=state[r][c]?"✓":"";
      cell.setAttribute("aria-label",`Catégorie ${r+1}, case ${c+1}`);
      cell.onclick=()=>{
        state[r][c]=!state[r][c];
        localStorage.setItem(KEY,JSON.stringify(state));
        render();
        showToast();
      };
      board.appendChild(cell);
    }
  }
  const total=state.flat().filter(Boolean).length;
  progress.textContent=`${total} / 144 cases`;
}
function showToast(){
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),700);
}
document.getElementById("reset").onclick=()=>{
  if(confirm("Commencer une nouvelle partie et effacer toute la progression ?")){
    state=Array.from({length:12},()=>Array(12).fill(false));
    localStorage.setItem(KEY,JSON.stringify(state));
    render();
  }
};
render();
</script>
</body>
</html>
